[project]
name = "harness-meta"
version = "1.15.0"
description = "LLM-agnostic harness engineering consultant with a Claude Code adapter"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["harness-engineering", "llm", "ai-agents", "claude-code", "developer-tools"]

[project.urls]
Homepage = "https://github.com/pdw96/harness-meta"
Repository = "https://github.com/pdw96/harness-meta"

[tool.coverage.run]
# Shell-based smoke tests live in tests/; Python skill/helper scripts live under skills/ and scripts/.
omit = [".claude/*", "sessions/*", "projects/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
