# pre-commit hooks for harness-meta
# Install: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      # mixed-line-ending intentionally omitted —
      # .gitattributes already enforces *.sh=lf / *.ps1=crlf at the git layer.

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        # SC1091: don't follow sourced files (smoke tests source fixtures)
        # SC2034: unused vars (intentional in some smoke tests for documentation)
        # NOTE (v1.68): inline list comma-splits `[--exclude=A,B]` → SC2034 가 파일명으로 오인됨.
        # block style 사용 — 항목당 한 줄로 콤마 분리 차단.
        args:
          - --severity=warning
          - --exclude=SC1091,SC2034

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json, --ignore-path, .markdownlintignore]
        files: \.md$

  # ACTIVE — milestone v1.1_meta-as-project (2026-05-08)
  - repo: local
    hooks:
      - id: smoke-projects-scope-discipline
        name: Smoke — projects/<name>/ROADMAP scope discipline (root thin index 강제)
        language: system
        entry: bash tests/smoke-projects-scope-discipline.sh
        pass_filenames: false
        files: 'ROADMAP\.md$|projects/.*/ROADMAP\.md$'

  # ACTIVE — milestone v1.1_smoke-precommit-rewrite (2026-05-08)
  # 4 hook 재작성: 7-stage JSON 포맷 + projects/<name>/milestones/ 경로 정합
  - repo: local
    hooks:
      - id: smoke-spec-verification
        name: Smoke — 7-stage JSON schema 정합 검증
        language: system
        entry: bash tests/smoke-spec-verification.sh
        pass_filenames: false
        files: 'projects/[^/]+/milestones/v[^/]+/.*\.md$|development/milestones/v[^/]+/.*\.md$'
      - id: smoke-scope-contract
        name: Smoke — out_of_scope 의무 + DESIGN.approval 게이트
        language: system
        entry: bash tests/smoke-scope-contract.sh
        pass_filenames: false
        files: 'projects/[^/]+/milestones/v[^/]+/.*\.md$|development/milestones/v[^/]+/.*\.md$|claude/commands/harness-meta\.md$'
      - id: smoke-cross-ref
        name: Smoke — Cross-ref 정합 검사 (실패 시 --fix 자동)
        language: system
        entry: bash tests/precommit-autofix-or-fail.sh tests/smoke-cross-ref.sh
        pass_filenames: false
        files: '\.(md|sh|ps1|toml|json|yaml|yml|py|txt)$'
      - id: smoke-claude-md-drift
        name: Smoke — root ↔ 모듈 CLAUDE.md drift 검사
        language: system
        entry: bash tests/smoke-claude-md-drift.sh
        pass_filenames: false
        files: 'CLAUDE\.md$|tests/smoke-.*\.sh$'

  # ACTIVE — milestone v3.1_workflow-policy-fine-tuning (2026-05-10)
  # bundling 정책 (ARCHITECTURE.md § 6.1) 자동 검증 — v3.0+ 9-stage-bundled era
  - repo: local
    hooks:
      - id: smoke-bundle-trigger
        name: Smoke — bundling 정책 (version 단위 1 milestone) 자동 검증
        language: system
        entry: bash tests/smoke-bundle-trigger.sh
        pass_filenames: false
        files: 'ROADMAP\.md$|projects/.*/ROADMAP\.md$'

  # ACTIVE — milestone v3.5_open-stage-discipline-strengthening (2026-05-11)
  # 9-stage-bundled era 디렉토리 ↔ milestones.md 페어링 자동 강제 (v3.4 L1 cascade 검증)
  - repo: local
    hooks:
      - id: smoke-open-stage-discipline
        name: Smoke — 9-stage-bundled era 디렉토리 ↔ milestones.md 페어링 자동 강제
        language: system
        entry: bash tests/smoke-open-stage-discipline.sh
        pass_filenames: false
        files: 'projects/[^/]+/milestones/v[0-9]+\.[0-9]+/.*\.md$|development/milestones/v[0-9]+\.[0-9]+/.*\.md$|\.pre-commit-config\.yaml$'

  # ACTIVE — milestone v6.3_entry-title-guideline-smoke-verification (2026-05-20)
  # ARCHITECTURE § 7.2 entry title 가이드 4 원칙 중 (1) ' + ' P1 mechanical proxy + (2) ≤ 60자 자동 강제.
  # (3) Active form + (4) Detail summary 분리 = AI 판단 위임 (자동 검증 제외).
  # CHANGELOG.md trigger 첫 도입 (regression p1_3).
  - repo: local
    hooks:
      - id: smoke-entry-title-guideline
        name: Smoke — entry title 가이드 4 원칙 (1)+(2) 자동 강제
        language: system
        entry: bash tests/smoke-entry-title-guideline.sh
        pass_filenames: false
        files: 'ROADMAP\.md$|projects/.*/ROADMAP\.md$|CHANGELOG\.md$'

  # ACTIVE — milestone v6.4_cascade-auto-sync-mechanism (2026-05-20)
  # cascade source → host narrative 자동 동기 mechanism 의 drift 자동 차단.
  # Host 안 `<!-- cascade-source: <path>#<anchor> expected-hash:<16-hex> -->` marker 가
  # source paragraph 의 실 hash 와 일치하는지 검증 (read-only). 갱신 책임 = scripts/cascade_sync.py.
  - repo: local
    hooks:
      - id: smoke-cascade-drift
        name: Smoke — cascade marker hash drift 자동 차단
        language: system
        entry: bash tests/smoke-cascade-drift.sh
        pass_filenames: false
        files: '\.md$'

  # v6.5_claude-autonomous-milestone-proposal 신규 — ROADMAP candidate_draft[] entry schema
  # 자동 강제 (7 필드 + category enum 2 값). v6.5 가 첫 실 작동 mechanism (v4.0 phase-7 narrative
  # 안 candidate_draft[] 도입 후 작동 0건 v5.8 evidence).
  - repo: local
    hooks:
      - id: smoke-candidate-draft-schema
        name: Smoke — candidate_draft[] entry schema 자동 강제
        language: system
        entry: bash tests/smoke-candidate-draft-schema.sh
        pass_filenames: false
        files: 'ROADMAP\.md$|projects/.*/ROADMAP\.md$'

  # v6.6_audit-chain-hallucination-auto-correction 신규 — audit chain (scanner/analyzer/mapper/proposer)
  # 산출물 안 hallucination (boolean/표/수치 3 method, v5.13 정전화) script-only 자동 검출.
  # fixture-based contract 검증 (6 fixture sub-dir + path traversal 차단). 정정은 사용자/orchestrator
  # 수동 (자율 범위 = 검출 only, R1 결정). AI Native § 7.1 다중 AI 협업 면 second cycle.
  - repo: local
    hooks:
      - id: smoke-audit-fact-verify
        name: Smoke — audit chain fact verify (v5.13 3 method script-only)
        language: system
        entry: bash tests/smoke-audit-fact-verify.sh
        pass_filenames: false
        files: '^scripts/audit_fact_verify\.py$|^tests/smoke-audit-fact-verify\.sh$|^tests/fixtures/audit-fact-verify/.*\.md$'

  # v6.20_agent-type-syntax-adoption 신규 — agents/*.md frontmatter schema 검증.
  # (a) frontmatter parse + (b) tools 필드 안 Agent(...) literal regex 정합
  # (c) Agent(...) 참조 agent name 이 agents/{name}.md 안 실제 존재 검증.
  # cycle 1 evidence = agents/audit-orchestrator.md (Agent(5 멤버 allowlist) 본 repo 첫 사용 사례).
  # v2.1.33+ Claude Code Agent(agent_type) syntax 흡수 sandbox 효과 강제 + 미래 cycle 2+ 회귀 차단.
  - repo: local
    hooks:
      - id: smoke-agent-frontmatter-schema
        name: Smoke — agents/*.md frontmatter Agent(agent_type) syntax 정합
        language: system
        entry: bash tests/smoke-agent-frontmatter-schema.sh
        pass_filenames: false
        files: '^agents/[^/]+\.md$|^tests/smoke-agent-frontmatter-schema\.sh$'
