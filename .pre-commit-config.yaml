# pre-commit hooks for harness-meta
# Install: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      # mixed-line-ending intentionally omitted —
      # .gitattributes already enforces *.sh=lf / *.ps1=crlf at the git layer.

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        # SC1091: don't follow sourced files (smoke tests source fixtures)
        # SC2034: unused vars (intentional in some smoke tests for documentation)
        # NOTE (v1.68): inline list comma-splits `[--exclude=A,B]` → SC2034 가 파일명으로 오인됨.
        # block style 사용 — 항목당 한 줄로 콤마 분리 차단.
        args:
          - --severity=warning
          - --exclude=SC1091,SC2034

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json, --ignore-path, .markdownlintignore]
        files: \.md$

  - repo: local
    hooks:
      - id: smoke-spec-verification
        # v1.64+: 실패 시 --fix 자동 시도 + 안내 후 abort. 사용자는 git diff 검토 → git add -u → re-commit
        name: Smoke — Spec verification § 검사 (실패 시 --fix 자동)
        language: system
        entry: bash tests/precommit-autofix-or-fail.sh tests/smoke-spec-verification.sh
        pass_filenames: false
        always_run: true
      - id: smoke-scope-contract
        # v1.64+: 동일 wrapper
        name: Smoke — Scope contract § 검사 (실패 시 --fix 자동)
        language: system
        entry: bash tests/precommit-autofix-or-fail.sh tests/smoke-scope-contract.sh
        pass_filenames: false
        always_run: true
