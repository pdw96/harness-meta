# pre-commit hooks for harness-meta
# Install: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      # mixed-line-ending intentionally omitted —
      # .gitattributes already enforces *.sh=lf / *.ps1=crlf at the git layer.

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        # SC1091: don't follow sourced files (smoke tests source fixtures)
        # SC2034: unused vars (intentional in some smoke tests for documentation)
        # NOTE (v1.68): inline list comma-splits `[--exclude=A,B]` → SC2034 가 파일명으로 오인됨.
        # block style 사용 — 항목당 한 줄로 콤마 분리 차단.
        args:
          - --severity=warning
          - --exclude=SC1091,SC2034

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json, --ignore-path, .markdownlintignore]
        files: \.md$

  - repo: local
    hooks:
      - id: smoke-spec-verification
        # v1.64+: 실패 시 --fix 자동 시도 + 안내 후 abort. 사용자는 git diff 검토 → git add -u → re-commit
        # v1.88: always_run 제거 + files: 가드 — session/milestone .md 변경 시만 실행
        name: Smoke — Spec verification § 검사 (실패 시 --fix 자동)
        language: system
        entry: bash tests/precommit-autofix-or-fail.sh tests/smoke-spec-verification.sh
        pass_filenames: false
        files: 'sessions/.*\.md$|milestones/.*\.md$'
      - id: smoke-scope-contract
        # v1.64+: 동일 wrapper
        # v1.88: always_run 제거 + files: 가드 — Stage 1(session PLAN) + Stage 2(OWNERSHIP.md) + Stage 3(harness-meta.md) 커버
        name: Smoke — Scope contract § 검사 (실패 시 --fix 자동)
        language: system
        entry: bash tests/precommit-autofix-or-fail.sh tests/smoke-scope-contract.sh
        pass_filenames: false
        files: 'sessions/.*\.md$|bootstrap/docs/OWNERSHIP\.md$|claude/commands/harness-meta\.md$'
      - id: smoke-cross-ref
        # v1.78b: living docs cross-ref (broken @import / markdown link) 자동 차단
        # v1.88: always_run 제거 + files: 가드 — .md 변경 시만 실행
        name: Smoke — Cross-ref 정합 § 검사 (실패 시 --fix 자동)
        language: system
        entry: bash tests/precommit-autofix-or-fail.sh tests/smoke-cross-ref.sh
        pass_filenames: false
        files: '\.md$'
      - id: smoke-claude-md-drift
        # v1.79b: root ↔ 모듈 CLAUDE.md drift (존재/back-ref/중복 블록/smoke count) 자동 차단
        # v1.88: always_run 제거 + files: 가드 — CLAUDE.md 변경 or smoke 파일 수 변동 시 실행
        name: Smoke — root ↔ 모듈 CLAUDE.md drift 검사
        language: system
        entry: bash tests/smoke-claude-md-drift.sh
        pass_filenames: false
        files: 'CLAUDE\.md$|tests/smoke-.*\.sh$'
