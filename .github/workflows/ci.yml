name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bash version (4+)
        run: |
          set -e
          bash --version
          # render-manifest.sh requires bash 4+ (indirect expansion)
          bash_major=$(bash -c 'echo $BASH_VERSION' | cut -d. -f1)
          if [ "$bash_major" -lt 4 ]; then
            echo "::error::bash 4+ required, got $bash_major"
            exit 1
          fi

      - name: Run active smoke tests
        env:
          HARNESS_META_ROOT: ${{ github.workspace }}
        run: |
          set -e
          # Active smokes only — mirrors .pre-commit-config.yaml hook registrations.
          # Inactive smokes (tests/smoke-*.sh 22건) are excluded: they verify
          # bootstrap/templates, sessions/, install-verify infra removed in
          # v1.4_infra-minimization. Historical files preserved but not CI-gated.
          # When adding a new active smoke, register it in both .pre-commit-config.yaml
          # AND this array.
          ACTIVE_SMOKES=(
            tests/smoke-projects-scope-discipline.sh
            tests/smoke-spec-verification.sh
            tests/smoke-scope-contract.sh
            tests/smoke-cross-ref.sh
            tests/smoke-claude-md-drift.sh
            tests/smoke-bundle-trigger.sh
          )
          fail_count=0
          for f in "${ACTIVE_SMOKES[@]}"; do
            echo ""
            echo "============================================================"
            echo "=== $f"
            echo "============================================================"
            if bash "$f"; then
              echo "::notice::PASS — $f"
            else
              echo "::error::FAIL — $f"
              fail_count=$((fail_count + 1))
            fi
          done
          echo ""
          echo "============================================================"
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count smoke test(s) failed"
            exit 1
          fi
          echo "All active smoke tests passed."
