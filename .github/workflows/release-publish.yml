name: Release Publish

# v6.19_changelog-github-releases-migration 안 도입.
# trigger 본질 = (1) push to main + commit msg 안 `[release:v{X.Y}]` marker contains
#              + (2) workflow_dispatch 수동 trigger (dry-run 옵션 포함).
# release body 본질 = development/milestones/v{X.Y}/MILESTONE.md ## REPORT 섹션 추출.
# 사용자 통제 본질 = commit msg marker 작성 자체 = 명시 결정 게이트 (DESIGN D9 + r_4 mitigation).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (예: v6.19 — 실 release 발행 또는 dry-run 검증)'
        required: true
        type: string
      dry_run:
        description: 'true 시 release 발급 skip (추출 logic + tag conflict check 만 실행)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release:v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION=$(printf '%s' "$COMMIT_MSG" | grep -oE '\[release:v[0-9]+\.[0-9]+\]' | head -1 | sed -E 's/\[release:(v[0-9]+\.[0-9]+)\]/\1/')
          fi
          if [ -z "${VERSION:-}" ]; then
            echo "::error::version 추출 실패 (commit msg marker 부재 또는 dispatch input 부재)"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+$'; then
            echo "::error::version regex mismatch — '$VERSION' (기대: ^v[0-9]+\.[0-9]+$)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::version=$VERSION"

      - name: Determine dry_run mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ inputs.dry_run }}"
          else
            DRY_RUN="false"
          fi
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "::notice::dry_run=$DRY_RUN"

      - name: Locate milestone artifact
        id: milestone
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # v8.13: 두 트랙 fallback — 9-stage MILESTONE.md 우선, 부재 시 가벼운 흐름 LIGHTWEIGHT.md
          MILESTONE_PATH="development/milestones/${VERSION}/MILESTONE.md"
          LIGHTWEIGHT_PATH="development/milestones/${VERSION}/LIGHTWEIGHT.md"
          if [ -f "$MILESTONE_PATH" ]; then
            ARTIFACT_PATH="$MILESTONE_PATH"; TRACK="9-stage"; SECTION="## REPORT"
          elif [ -f "$LIGHTWEIGHT_PATH" ]; then
            ARTIFACT_PATH="$LIGHTWEIGHT_PATH"; TRACK="lightweight"; SECTION="## 기록"
          else
            echo "::error::milestone 산출물 부재 — $MILESTONE_PATH / $LIGHTWEIGHT_PATH (9-stage MILESTONE.md 또는 가벼운 흐름 LIGHTWEIGHT.md 둘 다 없음 — 외부 project 또는 historical era release 부재)"
            exit 1
          fi
          echo "path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "section=$SECTION" >> "$GITHUB_OUTPUT"
          echo "::notice::milestone=$ARTIFACT_PATH (track=$TRACK, section=$SECTION)"

      - name: Extract release body section
        id: report
        env:
          ARTIFACT_PATH: ${{ steps.milestone.outputs.path }}
          SECTION: ${{ steps.milestone.outputs.section }}
          TRACK: ${{ steps.milestone.outputs.track }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # v8.13: 트랙별 섹션 추출 — 9-stage='## REPORT'(다음 H2 '## PROPOSE' 까지) / lightweight='## 기록'(다음 H2 없음 = EOF). 범용 awk = 섹션 시작 ~ 다음 '^## ' (또는 EOF).
          REPORT_BODY=$(awk -v sec="$SECTION" '$0 ~ "^"sec {flag=1; next} /^## /{flag=0} flag' "$ARTIFACT_PATH")
          if [ -z "$REPORT_BODY" ]; then
            echo "::error::$SECTION 섹션 추출 결과 empty — $ARTIFACT_PATH (track=$TRACK, flag-based awk mismatch 또는 섹션 미작성)"
            exit 1
          fi
          REPORT_FILE="${RUNNER_TEMP:-/tmp}/release-${VERSION}-body.md"
          {
            echo "# $VERSION — GitHub Release"
            echo ""
            echo "본 release body = \`$ARTIFACT_PATH\` 안 \`$SECTION\` 섹션 자동 추출 (release-publish workflow, track=$TRACK)."
            echo ""
            echo "---"
            echo ""
            printf '%s\n' "$REPORT_BODY"
            echo ""
            echo "---"
            echo ""
            echo "전체 milestone 산출물 = repo 안 \`$ARTIFACT_PATH\`."
          } > "$REPORT_FILE"
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          BODY_LINES=$(wc -l < "$REPORT_FILE")
          echo "::notice::release body = $REPORT_FILE ($BODY_LINES lines)"

      - name: Check tag conflict
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION 이미 존재 — 중복 발급 회피 (r_2 mitigation). gh release delete + git tag -d 후 재실행 필요"
            exit 1
          fi
          echo "::notice::tag $VERSION 충돌 부재 — 발급 가능"

      - name: Dry-run summary (skip tag + release)
        if: steps.mode.outputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPORT_FILE: ${{ steps.report.outputs.file }}
        run: |
          set -euo pipefail
          echo "::notice::DRY-RUN 모드 — tag 발급 + release 발급 skip"
          echo "==== body preview (first 50 lines) ===="
          head -50 "$REPORT_FILE"
          echo "==== body 끝 ===="
          echo "::notice::dry-run 완료 — 추출 logic + tag conflict check + body 본문 검증 PASS"

      - name: Configure git user
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.mode.outputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --follow-tags origin "$VERSION"
          echo "::notice::tag $VERSION pushed"

      - name: Create GitHub Release
        if: steps.mode.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPORT_FILE: ${{ steps.report.outputs.file }}
        run: |
          set -euo pipefail
          # v8.13: milestone 산출물 frontmatter title 추출 (옵션) — MILESTONE.md/LIGHTWEIGHT.md 공통, Locate step output 사용 (하드코딩 제거)
          ARTIFACT_PATH="${{ steps.milestone.outputs.path }}"
          TITLE=$(awk '/^---$/{c++; next} c==1 && /^title:/{sub(/^title:[[:space:]]*/, ""); print; exit}' "$ARTIFACT_PATH")
          RELEASE_TITLE="$VERSION — ${TITLE:-Release}"
          gh release create "$VERSION" \
            --title "$RELEASE_TITLE" \
            --notes-file "$REPORT_FILE" \
            --target "${{ github.sha }}"
          echo "::notice::release $VERSION 발급 완료"
